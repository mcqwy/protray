name: Deploy Astro site to Pages

on:
  # 推送到 master 分支时触发（你的默认分支是 master）
  push:
    branches: [master]
  # 允许在 Actions 页面手动触发
  workflow_dispatch:

# 权限：读取仓库、写 Pages、获取 OIDC token 用于部署
permissions:
  contents: read
  pages: write
  id-token: write

# 同时只跑一个部署任务，新的 push 不打断进行中的部署
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4